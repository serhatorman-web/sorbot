name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          SORBOT_TF=15m DRY_RUN=1 python3 scanner.py > out.txt 2>&1 || true
          grep -A2 -E "^----- TELEGRAM MESAJI" out.txt | grep -vE "^(--|🟩|🟥)$" | grep -vE "^[🟩🟥]+$" || true
          grep -E "Gönderildi|Telegram hatası|Traceback|Error" out.txt | head -40 || true
          tail -5 out.txt
