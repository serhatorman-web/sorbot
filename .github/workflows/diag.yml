name: Teşhis (geçici)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          for tf in 15m 1h; do SORBOT_TF=$tf DRY_RUN=1 python3 scanner.py 2>&1 || true; done
