name: diag
on:
  workflow_dispatch:
    inputs:
      small:
        default: ""
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/collect.py
        env:
          SMALL: ${{ github.event.inputs.small }}
      - name: Sonucu ayrı dala yükle
        run: |
          mkdir /tmp/r && cp out/signals.csv.gz /tmp/r/ && cd /tmp/r
          git init -q -b research-data
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add .
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m data
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" research-data
