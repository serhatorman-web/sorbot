name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - name: replay
        continue-on-error: true
        run: python3 tools/replay.py 2>&1 | sed 's/^/RP| /' || true
