name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - name: oran
        continue-on-error: true
        run: python3 tools/liverate.py 2>&1 | sed 's/^/LR| /' || true
