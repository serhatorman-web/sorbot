name: diag
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/diag_sslex.py
      - run: python3 scanner.py > o.txt 2>&1; grep -E "Traceback|Nokta atışı|hatası" o.txt | sed 's/^/DR| /'; awk '/ssl_|SSL (Buy|Sell) \+/{print "DR| "$0}' o.txt | head -20
