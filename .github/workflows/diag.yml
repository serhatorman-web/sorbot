name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - run: |
          for tf in 15m 1h 4h; do if [ "$tf" = "1h" ]; then DRY_RUN=1 SORBOT_INTRABAR=1 python3 scanner.py > o_$tf.txt 2>&1; else DRY_RUN=1 SORBOT_INTRABAR=1 SORBOT_TF=$tf python3 scanner.py > o_$tf.txt 2>&1; fi; awk "/TELEGRAM RESMİ/{getline a; getline b; getline c; print \"XX| \" a \" // \" b \" // \" c}" o_$tf.txt | sed "s/<[^>]*>//g" | head -6; done
