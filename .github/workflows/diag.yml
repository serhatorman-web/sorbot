name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          SORBOT_TF=1d DRY_RUN=1 PREVIEW=1 PREVIEW_SYMBOL=ETHUSDT python3 scanner.py > out.txt 2>&1 || true
          grep -E "Analiz edilen|Traceback|Error" out.txt | head || true
          awk '/TEST · ÖNİZLEME/{p=1} p{print} /^------------------------------------------$/{if(p){exit}}' out.txt
