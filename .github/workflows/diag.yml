name: diag
on: workflow_dispatch
jobs:
  t1h:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 1 saat
        continue-on-error: true
        run: python3 tools/earlybt.py 1h 2>&1 | sed 's/^/EB| /' || true
  t15:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 15dk
        continue-on-error: true
        run: python3 tools/earlybt.py 15m 2>&1 | sed 's/^/EB| /' || true
