name: Teşhis (geçici)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          for tf in 15m 1h; do
            echo "##### $tf"
            if [ "$tf" = "1h" ]; then DRY_RUN=1 python3 scanner.py; else DRY_RUN=1 SORBOT_TF=$tf python3 scanner.py; fi 2>&1 | grep -E "Gönderildi|Bitti|Traceback|Error|LONG ·|SHORT ·"
          done
