name: Teşhis (geçici)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "
          import json, scanner as sc
          cfg = json.load(open('config.json'))
          api = sc.Binance()
          u, *_ = sc.build_universe(api, cfg)
          c = sorted(m['symbol'] for m in u if m['type'] == 'COIN')
          print('YENI', len(c), ' '.join(x.removesuffix('USDT') for x in c))
          cfg['universe']['crypto_top_n'] = None
          u2, *_ = sc.build_universe(api, cfg)
          c2 = sorted(m['symbol'] for m in u2 if m['type'] == 'COIN')
          print('ESKI', len(c2))
          print('ELENEN', ' '.join(x.removesuffix('USDT') for x in c2 if x not in c))
          " || true
