name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: formtest
        continue-on-error: true
        run: python3 tools/formtest.py 2>&1 | sed 's/^/FT| /' || true
