name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: önizleme
        continue-on-error: true
        run: |
          DRY_RUN=1 PREVIEW=1 PREVIEW_SYMBOL=RUNEUSDT PREVIEW_DIR=short PREVIEW_RADAR=momentum python3 scanner.py 2>&1 | sed 's/^/MO| /' || true
          DRY_RUN=1 PREVIEW=1 PREVIEW_SYMBOL=ADAUSDT PREVIEW_DIR=short PREVIEW_RADAR=early python3 scanner.py 2>&1 | sed 's/^/EA| /' || true
