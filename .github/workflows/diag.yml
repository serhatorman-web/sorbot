name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - name: mum içi örnek
        env:
          DRY_RUN: "1"
          SORBOT_INTRABAR: "1"
        run: |
          for tf in 15m 1h 4h; do
            if [ "$tf" = "1h" ]; then out=$(python3 scanner.py 2>&1); else out=$(SORBOT_TF=$tf python3 scanner.py 2>&1); fi
            echo "$out" | grep -A4 "TELEGRAM RESMİ" | grep -v "^--" | sed "s/^/XX| $tf /" | head -40
          done
          n=0; for f in state/previews/*.png; do [ -f "$f" ] || continue; n=$((n+1)); [ $n -gt 12 ] && break
            echo "XX| dosya img$n $f"
            base64 -w0 "$f" | fold -w 3000 | awk -v t="img$n" '{print "IM| " t " " NR " " $0}'; done
