name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: radar önizleme
        continue-on-error: true
        run: |
          DRY_RUN=1 PREVIEW=1 PREVIEW_SYMBOL=ZECUSDT PREVIEW_DIR=long PREVIEW_RADAR=early python3 scanner.py 2>&1 | sed 's/^/EA| /' || true
