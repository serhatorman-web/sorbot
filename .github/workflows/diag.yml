name: Teşhis (geçici)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/full_check.py
      - run: python3 scanner.py
        env:
          DRY_RUN: "1"
          PREVIEW: "1"
