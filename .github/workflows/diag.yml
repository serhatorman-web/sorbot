name: Teşhis (geçici)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q matplotlib && python3 tools/diag_tl_plot.py
      - run: for f in out/*.png; do echo "IMG $(basename $f) $(base64 -w0 $f)"; done
      - uses: actions/upload-artifact@v4
        with:
          name: grafikler
          path: out/
