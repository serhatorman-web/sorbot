name: Teşhis (geçici)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "
          import json, scanner as sc
          cfg = json.load(open('config.json'))
          u, *_ = sc.build_universe(sc.Binance(), cfg)
          c = sorted(m['symbol'].removesuffix('USDT') for m in u if m['type'] == 'COIN')
          print('KRIPTO', len(c), ' '.join(c))
          for k in ('OP','IMX','RUNE','SAND','GALA','APE','WIF','1000BONK','1000FLOKI','PHAROS','IDOL','MAGMA','BEAT'):
              print('VAR' if k in c else 'YOK', k)
          " || true
