name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Durum kaydını geri yükle (sadece okuma)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: sorbot-loop-state-none
          restore-keys: |
            sorbot-loop-state-
      - name: radarlog
        continue-on-error: true
        run: python3 tools/radarlog.py 2>&1 | sed 's/^/RL| /' || true
