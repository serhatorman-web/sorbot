name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - run: |
          s=$(date +%s); DRY_RUN=1 SORBOT_INTRABAR=1 SORBOT_TF=1d python3 scanner.py > o.txt 2>&1; echo "XX| kod $? süre $(( $(date +%s) - s ))s"
          grep -E "Mum içi|Mum verisi|Traceback|Error" o.txt | sed "s/^/XX| /"
          grep -A2 "TELEGRAM RESMİ" o.txt | grep KIRIL | sed "s/<[^>]*>//g; s/^/XX| /" | head
