name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: preview
        continue-on-error: true
        run: |
          for s in BTCUSDT SOLUSDT; do SORBOT_TF=15m DRY_RUN=1 PREVIEW=1 PREVIEW_SYMBOL=$s python3 scanner.py 2>&1 | sed 's/^/PV| /' || true; done
