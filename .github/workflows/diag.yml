name: diag
on:
  workflow_dispatch: {}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - run: python3 tools/diag_match.py 15m 1h 4h
      - run: SORBOT_TF=15m python3 scanner.py 2>&1 | grep -E "Traceback|Error|hatası|Bitti|Anlık" || true
