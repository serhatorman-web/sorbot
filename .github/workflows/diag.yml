name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: patest
        continue-on-error: true
        run: python3 tools/patest.py 2>&1 | sed 's/^/PA| /' || true
