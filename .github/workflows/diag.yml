name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - run: python3 tools/ex.py
      - run: PREVIEW=1 DRY_RUN=1 PREVIEW_SYMBOL=SOLUSDT PREVIEW_DIR=short PREVIEW_RADAR=start SORBOT_TF=15m python3 scanner.py | sed -n '/TELEGRAM MESAJI/,/TREND TABLOSU/p' | sed 's/^/XX| /'
