name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: PREVIEW=1 DRY_RUN=1 PREVIEW_SYMBOL=BTCUSDT PREVIEW_DIR=short PREVIEW_RADAR=start SORBOT_TF=15m python3 scanner.py | sed -n '/TELEGRAM MESAJI/,/Giriş/p' | sed 's/^/XX| /'
      - run: PREVIEW=1 DRY_RUN=1 PREVIEW_SYMBOL=SOLUSDT PREVIEW_DIR=long SORBOT_TF=15m python3 scanner.py | sed -n '/TELEGRAM MESAJI/,/Giriş/p' | sed 's/^/XX| /'
      - run: DRY_RUN=1 SORBOT_INTRABAR=1 SORBOT_TF=15m timeout 200 python3 scanner.py 2>&1 | tail -5 | sed 's/^/XX| IB /'
