name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - run: |
          for a in "SOLUSDT long start" "BTCUSDT short start" "XRPUSDT long momentum" "ETHUSDT short momentum" "ETHUSDT long early" "BTCUSDT short early" "XRPUSDT short reversal" "SOLUSDT long reversal"; do
            set -- $a
            PREVIEW=1 DRY_RUN=1 PREVIEW_SYMBOL=$1 PREVIEW_DIR=$2 PREVIEW_RADAR=$3 SORBOT_TF=15m python3 scanner.py | sed -n '/TELEGRAM MESAJI/,/İNDİKATÖRLER/p' | sed 's/^/XX| /'
          done
      - run: python3 tools/ex.py
