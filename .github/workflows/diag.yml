name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user matplotlib || true
      - name: kanal dağılımı (deneme modu)
        env:
          DRY_RUN: "1"
        run: |
          for tf in 15m 1h 4h; do
            if [ "$tf" = "1h" ]; then python3 scanner.py > out_$tf.txt 2>&1; else SORBOT_TF=$tf python3 scanner.py > out_$tf.txt 2>&1; fi
            awk -v tf=$tf '/TELEGRAM MESAJI|TELEGRAM RESMİ/{hdr=$0; getline a; getline b; print "XX| " tf " | " hdr " | " a " " b}' out_$tf.txt | sed 's/<[^>]*>//g; s/🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩//g; s/🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥//g' | cut -c1-230
          done
