name: SorBot Tarama

# Zamanlanmış çalıştırma loop.yml'ye taşındı (GitHub cron gecikmeleri yüzünden).
# Bu workflow elle deneme/test için duruyor.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegram'a gönderme, sadece log'a yaz"
        type: boolean
        default: false
      test_telegram:
        description: "Sadece Telegram bağlantı testi mesajı gönder"
        type: boolean
        default: false

# En az yetki: repoyu sadece okuyabilir
permissions:
  contents: read

# Aynı anda iki tarama çalışmasın (çift mesajı önler)
concurrency:
  group: sorbot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Gönderilen sinyallerin kaydı (aynı sinyal tekrar gelmesin diye)
      - name: Durum kaydını geri yükle
        uses: actions/cache/restore@v4
        with:
          path: state
          key: sorbot-state-${{ github.run_id }}
          restore-keys: sorbot-state-

      - name: Tara
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
        run: python3 scanner.py

      # Saatlik piyasa raporu + haberler (+ sabah ekonomik takvimi)
      - name: Piyasa raporu
        if: always() && !inputs.test_telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 report.py

      - name: Durum kaydını sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: sorbot-state-${{ github.run_id }}
