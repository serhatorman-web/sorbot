name: Binance Erisim Testi

# Sadece erisim/kesif testi: Binance'e herkese acik veri istekleri atar ve
# sonuclari log'a yazar. API anahtari veya secret kullanmaz.
on:
  push:
    paths:
      - ".github/workflows/binance-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Kontrat yapisi kesfi
        shell: python3 {0}
        run: |
          import json, urllib.request, collections
          B = "https://www.binance.com"
          def get(path):
              req = urllib.request.Request(B + path, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      hdr = {k: v for k, v in r.headers.items() if "weight" in k.lower() or "limit" in k.lower()}
                      return r.status, json.loads(r.read()), hdr
              except Exception as e:
                  return getattr(e, "code", "ERR"), str(e)[:200], {}

          st, info, hdr = get("/fapi/v1/exchangeInfo")
          print("exchangeInfo:", st, hdr)
          syms = info["symbols"]
          print("toplam sembol:", len(syms))
          print("ornek alanlar:", sorted(syms[0].keys()))
          for key in ("contractType", "status", "quoteAsset", "underlyingType", "marginAsset"):
              print(key, collections.Counter(s.get(key) for s in syms).most_common(15))
          sub = collections.Counter(tuple(s.get("underlyingSubType") or []) for s in syms)
          print("underlyingSubType:", sub.most_common(40))
          usdt = [s for s in syms if s.get("quoteAsset") == "USDT" and s.get("contractType") == "PERPETUAL" and s.get("status") == "TRADING"]
          print("USDT PERPETUAL TRADING:", len(usdt))
          non_coin = [s["symbol"] for s in usdt if s.get("underlyingType") != "COIN"]
          print("COIN olmayanlar (%d):" % len(non_coin), non_coin)
          for name in ("BTCUSDT", "NVDAUSDT", "AMDUSDT", "XAUUSDT"):
              s = next((x for x in syms if x["symbol"] == name), None)
              if s:
                  s = {k: v for k, v in s.items() if k not in ("filters", "orderTypes", "timeInForce")}
              print(name, json.dumps(s, ensure_ascii=False))
          print("rateLimits:", info.get("rateLimits"))

          for path in ("/fapi/v1/ticker/24hr?symbol=NVDAUSDT",
                       "/fapi/v1/klines?symbol=NVDAUSDT&interval=1h&limit=3",
                       "/fapi/v1/premiumIndex?symbol=BTCUSDT",
                       "/fapi/v1/openInterest?symbol=BTCUSDT",
                       "/futures/data/openInterestHist?symbol=BTCUSDT&period=1h&limit=3",
                       "/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=1h&limit=2"):
              st, body, hdr = get(path)
              print(f"[{st}] {path} {hdr}\n   {str(body)[:250]}")
          st, body, hdr = get("/fapi/v1/ticker/24hr")
          print("[%s] tum 24hr ticker: %s adet %s" % (st, len(body) if isinstance(body, list) else body, hdr))
