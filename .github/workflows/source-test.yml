name: Kaynak Erisim Testi

# Gecici: Binance'teki ABD hisse kontratlarini ve hacimlerini listeler.
on:
  push:
    paths:
      - ".github/workflows/source-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Kaynaklar
        shell: python3 {0}
        run: |
          import urllib.request, json
          UA = "Mozilla/5.0"
          get = lambda u: json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30).read())
          info = get("https://www.binance.com/fapi/v1/exchangeInfo")
          tick = {t["symbol"]: float(t["quoteVolume"]) for t in get("https://www.binance.com/fapi/v1/ticker/24hr")}
          eq = [(s["symbol"], tick.get(s["symbol"], 0)) for s in info["symbols"]
                if s.get("underlyingType") == "EQUITY" and s.get("status") == "TRADING" and s.get("quoteAsset") == "USDT"]
          eq.sort(key=lambda x: -x[1])
          print("EQUITY_COUNT", len(eq))
          print("EQUITY_LIST " + " ".join(f"{s.replace('USDT','')}:{v/1e6:.1f}" for s, v in eq))
