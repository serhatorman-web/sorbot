name: Kaynak Erisim Testi

# Gecici: Binance emtia kontratlari (spot altin/gumus).
on:
  push:
    paths:
      - ".github/workflows/source-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Kaynaklar
        shell: python3 {0}
        run: |
          import urllib.request, json
          get = lambda u: json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read())
          info = get("https://www.binance.com/fapi/v1/exchangeInfo")
          com = [(s["symbol"], s.get("underlyingSubType")) for s in info["symbols"] if s.get("underlyingType") == "COMMODITY" and s.get("status") == "TRADING"]
          print("EMTIA:", com)
          for sym, _ in com:
              t = get(f"https://www.binance.com/fapi/v1/ticker/24hr?symbol={sym}")
              p = get(f"https://www.binance.com/fapi/v1/premiumIndex?symbol={sym}")
              print(f"  {sym}: son {t['lastPrice']} 24s {t['priceChangePercent']}% endeks {p.get('indexPrice')}")
          for s in ("PAXGUSDT", "XAUTUSDT"):
              try:
                  t = get(f"https://data-api.binance.vision/api/v3/ticker/24hr?symbol={s}")
                  print(f"  spot {s}: {t['lastPrice']} 24s {t['priceChangePercent']}%")
              except Exception as e:
                  print(f"  spot {s}: HATA {e}")
