name: Kaynak Erisim Testi

# Gecici test: Farside ETF tablosunun yapisini inceler.
on:
  push:
    paths:
      - ".github/workflows/source-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Kaynaklar
        shell: python3 {0}
        run: |
          import urllib.request, re, html
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in ("https://farside.co.uk/btc/", "https://farside.co.uk/eth/"):
              req = urllib.request.Request(u, headers={"User-Agent": UA})
              body = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "ignore")
              tables = re.findall(r"<table[^>]*>.*?</table>", body, re.S)
              print(u, "tablo sayisi:", len(tables), [re.search(r"<table[^>]*>", t).group(0)[:80] for t in tables])
              t = max(tables, key=len)
              rows = re.findall(r"<tr[^>]*>(.*?)</tr>", t, re.S)
              def cells(r):
                  return [html.unescape(re.sub(r"<[^>]+>", "", c)).strip() for c in re.findall(r"<t[hd][^>]*>(.*?)</t[hd]>", r, re.S)]
              print("satir:", len(rows))
              for r in rows[:3]:
                  print("  BAS:", cells(r))
              for r in rows[-8:]:
                  print("  SON:", cells(r))
              print("  ham ornek:", rows[-6][:400].replace("\n", " "))
