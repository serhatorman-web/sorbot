name: Kaynak Erisim Testi

# Gecici test: zincir ustu balina transferleri icin alternatif kaynaklar.
on:
  push:
    paths:
      - ".github/workflows/source-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kaynaklar
        shell: python3 {0}
        run: |
          import urllib.request, json, time
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def get(u, data=None):
              req = urllib.request.Request(u, data=data, headers={"User-Agent": UA, "Accept": "application/json",
                                                                  "Content-Type": "application/json"})
              t = time.time()
              with urllib.request.urlopen(req, timeout=30) as r:
                  b = r.read()
              return b, time.time() - t
          # BTC: blockchain.info tam blok
          try:
              b, dt = get("https://blockchain.info/latestblock")
              h = json.loads(b)["hash"]
              b, dt = get(f"https://blockchain.info/rawblock/{h}")
              blk = json.loads(b)
              big = []
              for tx in blk["tx"]:
                  outs = [o.get("value", 0) / 1e8 for o in tx.get("out", [])]
                  if outs and max(outs) >= 100:
                      big.append((tx["hash"][:12], round(max(outs), 1), round(sum(outs), 1)))
              print(f"[OK] blockchain.info blok {blk['height']}: {len(blk['tx'])} tx, {len(b)/1e6:.1f} MB, {dt:.1f}s, >=100 BTC cikti: {big[:8]}")
          except Exception as e:
              print("[HATA] blockchain.info:", getattr(e, "code", ""), str(e)[:150])
          # BTC: mempool.space blok tx sayfasi
          try:
              b, dt = get("https://mempool.space/api/blocks/tip/hash")
              h = b.decode()
              b, dt = get(f"https://mempool.space/api/block/{h}/txs/0")
              print(f"[OK] mempool txs sayfa: {len(json.loads(b))} tx, {dt:.1f}s")
          except Exception as e:
              print("[HATA] mempool:", getattr(e, "code", ""), str(e)[:150])
          # ETH: herkese acik RPC'ler
          for rpc in ("https://ethereum-rpc.publicnode.com", "https://cloudflare-eth.com", "https://eth.llamarpc.com",
                      "https://rpc.ankr.com/eth", "https://eth.drpc.org"):
              try:
                  b, dt = get(rpc, json.dumps({"jsonrpc": "2.0", "id": 1, "method": "eth_blockNumber", "params": []}).encode())
                  n = int(json.loads(b)["result"], 16)
                  b, dt = get(rpc, json.dumps({"jsonrpc": "2.0", "id": 1, "method": "eth_getBlockByNumber",
                                               "params": [hex(n), True]}).encode())
                  txs = json.loads(b)["result"]["transactions"]
                  big = [round(int(t["value"], 16) / 1e18, 1) for t in txs if int(t["value"], 16) / 1e18 >= 100]
                  print(f"[OK] {rpc}: blok {n}, {len(txs)} tx, {len(b)/1e3:.0f} KB, {dt:.2f}s, >=100 ETH: {big}")
              except Exception as e:
                  print(f"[HATA] {rpc}:", getattr(e, "code", ""), str(e)[:120])
